name: Android CI

# 号池风控判定（失败分类/冷却分级/bot_flag 策略/健康分级）都在 RiskLogic 里，
# 这些分支在真机上很难穷举，必须靠 JVM 单测兜住 —— 所以 CI 的第一道闸就是单测。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不用 android-actions/setup-android：它在新镜像上会因为找不到 'tools' 包直接挂，
      # 而 runner 本身预装了 SDK + cmdline-tools，只差我们在 compileSdk 用到的 platform/build-tools。
      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdk=$SDK sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: 单元测试（风控纯逻辑）
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
  assemble:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdk=$SDK sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: 编译 release（确保混淆规则不炸）
        run: ./gradlew assembleRelease --no-daemon